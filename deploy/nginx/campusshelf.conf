# CampusShelf — Nginx reverse proxy + optimization (Phase 7)
# 作用：反向代理到 Node.js (localhost:3000)，开启 gzip、静态资源缓存。
# 注意：本文件仅用于答辩演示性能优化与部署能力，不是基础功能运行依赖。
#
# Windows 使用方式（WSL / 或安装 nginx for Windows）：
#   1) 将本文件内容放入 nginx 的 conf.d/ 或 nginx.conf 的 http 块中
#   2) 修改 server_name 为你的域名或 localhost
#   3) 启动 Node 服务： npm start  (监听 3000)
#   4) 启动 Nginx：     nginx -s reload
#   5) 浏览器访问：     http://localhost   (由 Nginx 的 80 端口转发到 3000)

server {
    listen 80;
    server_name localhost;

    # ---- gzip 压缩：减少文本类资源体积 ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ---- 反向代理到 Node.js ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 支持 WebSocket / 长连接（如后续启用）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- 静态资源缓存（JS/CSS/图片 7 天） ----
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # 不缓存 HTML，保证内容更新立即生效
    }

    # ---- HTML 不长期缓存 ----
    location ~* \.html$ {
        proxy_pass http://127.0.0.1:3000;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ---- 可选：基础限流，防止恶意刷接口 ----
    # limit_req_zone $binary_remote_addr zone=campusshelf:10m rate=10r/s;
    # location /api/ {
    #     limit_req zone=campusshelf burst=20 nodelay;
    #     proxy_pass http://127.0.0.1:3000;
    # }
}
