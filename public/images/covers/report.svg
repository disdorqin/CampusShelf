<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A34A"/>
      <stop offset="50%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#4ADE80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <circle cx="370" cy="40" r="60" fill="rgba(255,255,255,0.06)"/>
  <circle cx="30" cy="270" r="70" fill="rgba(255,255,255,0.04)"/>
  <!-- 实验器材插画 -->
  <g filter="url(#shadow)" transform="translate(110,40)">
    <!-- 试管架 -->
    <rect x="10" y="120" width="180" height="20" rx="3" fill="#D1FAE5"/>
    <rect x="10" y="115" width="180" height="8" rx="2" fill="#A7F3D0"/>
    <!-- 试管 1 -->
    <rect x="30" y="20" width="22" height="98" rx="10" fill="#fff" opacity="0.9"/>
    <rect x="32" y="60" width="18" height="56" rx="8" fill="#86EFAC" opacity="0.7"/>
    <rect x="30" y="15" width="22" height="8" rx="4" fill="#86EFAC"/>
    <!-- 试管 2 -->
    <rect x="70" y="35" width="22" height="83" rx="10" fill="#fff" opacity="0.9"/>
    <rect x="72" y="70" width="18" height="46" rx="8" fill="#6EE7B7" opacity="0.7"/>
    <rect x="70" y="30" width="22" height="8" rx="4" fill="#6EE7B7"/>
    <!-- 试管 3 -->
    <rect x="110" y="10" width="22" height="108" rx="10" fill="#fff" opacity="0.9"/>
    <rect x="112" y="50" width="18" height="66" rx="8" fill="#34D399" opacity="0.7"/>
    <rect x="110" y="5" width="22" height="8" rx="4" fill="#34D399"/>
    <!-- 试管 4 -->
    <rect x="148" y="40" width="22" height="78" rx="10" fill="#fff" opacity="0.9"/>
    <rect x="150" y="70" width="18" height="46" rx="8" fill="#10B981" opacity="0.7"/>
    <rect x="148" y="35" width="22" height="8" rx="4" fill="#10B981"/>
    <!-- 气泡 -->
    <circle cx="36" cy="75" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="38" cy="65" r="2" fill="rgba(255,255,255,0.4)"/>
    <circle cx="116" cy="65" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="118" cy="55" r="2" fill="rgba(255,255,255,0.4)"/>
  </g>
  <text x="200" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#fff" filter="url(#shadow)">实验报告</text>
  <text x="200" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">数据详实，实验无忧</text>
  <rect x="120" y="275" width="160" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
</svg>
