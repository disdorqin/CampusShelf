<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891B2"/>
      <stop offset="50%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- 装饰元素 -->
  <circle cx="340" cy="40" r="70" fill="rgba(255,255,255,0.06)"/>
  <circle cx="50" cy="270" r="50" fill="rgba(255,255,255,0.04)"/>
  <!-- 笔记本插画 -->
  <g filter="url(#shadow)" transform="translate(90,50)">
    <rect x="0" y="0" width="220" height="170" rx="6" fill="#fff"/>
    <!-- 螺旋装订 -->
    <g fill="none" stroke="#CBD5E1" stroke-width="2">
      <circle cx="110" cy="10" r="5"/><circle cx="130" cy="10" r="5"/>
      <circle cx="150" cy="10" r="5"/><circle cx="90" cy="10" r="5"/>
    </g>
    <!-- 横线 -->
    <line x1="16" y1="36" x2="200" y2="36" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="16" y1="52" x2="200" y2="52" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="16" y1="68" x2="200" y2="68" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="16" y1="84" x2="170" y2="84" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="16" y1="100" x2="200" y2="100" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="16" y1="116" x2="180" y2="116" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="16" y1="132" x2="200" y2="132" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="16" y1="148" x2="140" y2="148" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- 荧光笔标记 -->
    <rect x="16" y="36" width="60" height="16" rx="2" fill="#FDE68A" opacity="0.6"/>
    <rect x="16" y="84" width="80" height="16" rx="2" fill="#C7D2FE" opacity="0.6"/>
    <!-- 笔 -->
    <rect x="18" y="155" width="6" height="12" rx="2" fill="#0891B2"/>
  </g>
  <text x="200" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#fff" filter="url(#shadow)">课程笔记</text>
  <text x="200" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">学霸精华，考试利器</text>
</svg>
