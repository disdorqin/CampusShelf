<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CA8A04"/>
      <stop offset="50%" style="stop-color:#EAB308"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <circle cx="340" cy="30" r="70" fill="rgba(255,255,255,0.06)"/>
  <circle cx="50" cy="270" r="55" fill="rgba(255,255,255,0.04)"/>
  <!-- 学习用品插画 -->
  <g filter="url(#shadow)" transform="translate(80,45)">
    <!-- 书包主体 -->
    <rect x="30" y="30" width="140" height="120" rx="20" fill="#FEF3C7"/>
    <rect x="30" y="30" width="140" height="120" rx="20" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <!-- 书包盖 -->
    <path d="M40,30 Q100,10 160,30" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <!-- 书包扣子 -->
    <circle cx="100" cy="65" r="8" fill="#D97706"/>
    <circle cx="100" cy="65" r="4" fill="#FBBF24"/>
    <!-- 书包口袋 -->
    <rect x="50" y="80" width="100" height="30" rx="6" fill="#FDE68A"/>
    <rect x="50" y="80" width="100" height="30" rx="6" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- 笔筒（右侧） -->
    <rect x="170" y="55" width="24" height="95" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <!-- 笔 -->
    <rect x="176" y="35" width="6" height="25" rx="2" fill="#EF4444"/>
    <rect x="186" y="40" width="6" height="20" rx="2" fill="#3B82F6"/>
    <rect x="181" y="30" width="6" height="28" rx="2" fill="#10B981"/>
    <!-- 尺子 -->
    <rect x="10" y="80" width="22" height="70" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <rect x="12" y="82" width="18" height="2" rx="1" fill="#D97706"/>
    <rect x="12" y="90" width="18" height="2" rx="1" fill="#D97706"/>
    <rect x="12" y="98" width="10" height="2" rx="1" fill="#D97706"/>
  </g>
  <text x="200" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#fff" filter="url(#shadow)">学习用品</text>
  <text x="200" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">文具仪器，应有尽有</text>
  <rect x="120" y="275" width="160" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
</svg>
