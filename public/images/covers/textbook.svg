<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <!-- 装饰圆 -->
  <circle cx="320" cy="50" r="80" fill="rgba(255,255,255,0.06)"/>
  <circle cx="360" cy="260" r="60" fill="rgba(255,255,255,0.04)"/>
  <circle cx="40" cy="280" r="40" fill="rgba(255,255,255,0.05)"/>
  <!-- 书本插画 - 三本书堆叠 -->
  <g filter="url(#shadow)" transform="translate(110,55)">
    <!-- 第一本（底部最大） -->
    <rect x="0" y="55" width="180" height="130" rx="4" fill="url(#book)"/>
    <rect x="8" y="58" width="164" height="8" rx="2" fill="#C7D2FE"/>
    <line x1="12" y1="80" x2="168" y2="80" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="12" y1="96" x2="168" y2="96" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="12" y1="112" x2="140" y2="112" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="12" y1="128" x2="168" y2="128" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="12" y1="144" x2="100" y2="144" stroke="#E0E7FF" stroke-width="2"/>
    <rect x="170" y="58" width="8" height="124" rx="2" fill="#A5B4FC"/>
    <!-- 第二本 -->
    <rect x="15" y="40" width="160" height="115" rx="4" fill="#E0E7FF" opacity="0.9"/>
    <rect x="22" y="43" width="146" height="7" rx="2" fill="#C7D2FE"/>
    <line x1="26" y1="62" x2="150" y2="62" stroke="#C7D2FE" stroke-width="2"/>
    <line x1="26" y1="76" x2="150" y2="76" stroke="#C7D2FE" stroke-width="2"/>
    <line x1="26" y1="90" x2="120" y2="90" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="166" y="43" width="7" height="110" rx="2" fill="#A5B4FC"/>
    <!-- 第三本（最上面） -->
    <rect x="30" y="25" width="140" height="100" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="36" y="28" width="128" height="6" rx="2" fill="#C7D2FE"/>
    <line x1="40" y1="44" x2="130" y2="44" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="40" y1="56" x2="140" y2="56" stroke="#E0E7FF" stroke-width="2"/>
    <line x1="40" y1="68" x2="110" y2="68" stroke="#E0E7FF" stroke-width="2"/>
    <rect x="162" y="28" width="6" height="95" rx="2" fill="#A5B4FC"/>
  </g>
  <!-- 分类文字 -->
  <text x="200" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#fff" filter="url(#shadow)">二手教材</text>
  <text x="200" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">从学长学姐手中传递知识</text>
  <!-- 底部装饰条 -->
  <rect x="120" y="268" width="160" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
</svg>
