<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA580C"/>
      <stop offset="50%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <circle cx="30" cy="40" r="50" fill="rgba(255,255,255,0.06)"/>
  <circle cx="370" cy="270" r="70" fill="rgba(255,255,255,0.04)"/>
  <!-- 电子书/屏幕插画 -->
  <g filter="url(#shadow)" transform="translate(90,35)">
    <!-- 平板/屏幕 -->
    <rect x="0" y="10" width="220" height="150" rx="10" fill="#fff"/>
    <rect x="4" y="14" width="212" height="138" rx="6" fill="#FFF7ED"/>
    <!-- 屏幕顶部装饰 -->
    <rect x="90" y="18" width="40" height="3" rx="1.5" fill="#FDBA74"/>
    <!-- 电子书文字内容 -->
    <rect x="18" y="34" width="140" height="8" rx="3" fill="#FED7AA" opacity="0.6"/>
    <rect x="18" y="50" width="184" height="6" rx="2" fill="#FFEDD5"/>
    <rect x="18" y="64" width="160" height="6" rx="2" fill="#FFEDD5"/>
    <rect x="18" y="78" width="184" height="6" rx="2" fill="#FFEDD5"/>
    <rect x="18" y="92" width="120" height="6" rx="2" fill="#FFEDD5"/>
    <rect x="18" y="110" width="184" height="6" rx="2" fill="#FED7AA" opacity="0.6"/>
    <rect x="18" y="124" width="100" height="6" rx="2" fill="#FFEDD5"/>
    <!-- 翻页角 -->
    <path d="M220,120 L200,120 L200,140 Z" fill="#E0E0E0" opacity="0.3"/>
    <!-- 页码 -->
    <text x="200" y="148" text-anchor="end" font-size="10" fill="#FDBA74" font-family="system-ui,sans-serif">p.42</text>
  </g>
  <text x="200" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#fff" filter="url(#shadow)">电子书</text>
  <text x="200" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">轻便阅读，随时随地</text>
  <rect x="120" y="275" width="160" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
</svg>
